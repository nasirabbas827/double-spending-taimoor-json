<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attack Data Visualization</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .card { border-radius: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        img { max-width: 100%; border-radius: 10px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a href="{{ url_for('index') }}" class="btn btn-outline-success">Back to Dashboard</a>
        </div>
    </nav>
    <div class="container mt-4">
        <h2 class="text-white text-center mb-4">Attack Outcomes Visualization</h2>
        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-header bg-success text-white">Success Rate (Pie)</div>
                    <div class="card-body">
                        <img src="data:image/png;base64,{{ pie_img }}" alt="Success Pie">
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-header bg-primary text-white">Success % by Hash Rate (Bar)</div>
                    <div class="card-body">
                        <img src="data:image/png;base64,{{ bar_img }}" alt="Hash Bar">
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-header bg-warning text-dark">Success by Network Delay (Scatter)</div>
                    <div class="card-body">
                        <img src="data:image/png;base64,{{ scatter_img }}" alt="Delay Scatter">
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-header bg-danger text-white">Victim Loss Distribution (Hist)</div>
                    <div class="card-body">
                        <img src="data:image/png;base64,{{ hist_img }}" alt="Loss Hist">
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
